<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIYO.BAR — Cheers</title>

<link rel="icon" type="image/png" href="favicon-512.png">

<!-- Open Graph / WhatsApp preview -->
<meta property="og:title" content="PIYO.BAR — Cheers">
<meta property="og:description" content="Tera peg lag gaya bar mein! Aa ja PIYO.BAR pe cheers karne.">
<meta property="og:image" content="https://shalakaofficial.github.io/PIYO.BAR/favicon-512.png">
<meta property="og:url" content="https://shalakaofficial.github.io/PIYO.BAR/cheers.html">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>

  h1.page-title {
    font-size: clamp(28px, 4vw, 44px);
    margin: 0 0 8px;
    color: #ffe0a6;
    font-weight: 600;
    text-align: center;
  }

  .welcome-line {
    font-size: 16px;
    color: rgba(242,229,207,0.8);
    margin: 0 0 22px;
    text-align: center;
  }

  .top-title-row {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 24px 0;
  }

  /* Override the home page's vertical-centering behavior —
     on Cheers we want the TV and cards to start flush at the top */
  .split-wrap {
    align-items: start !important;
    align-content: start !important;
  }

  /* RETRO TV — wooden cabinet console style */

  .tv {
    background:
      repeating-linear-gradient(100deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 2px, transparent 2px, transparent 6px),
      linear-gradient(155deg, #6b4a2e 0%, #4a3320 45%, #3a2717 100%);
    border-radius: 16px;
    padding: 20px 20px 0;
    box-shadow:
      0 14px 32px rgba(0,0,0,0.55),
      inset 0 0 0 2px rgba(255,255,255,0.06),
      inset 0 2px 6px rgba(255,255,255,0.08);
    position: relative;
  }

  /* Top highlight sheen suggesting varnished wood */
  .tv::before {
    content: "";
    position: absolute;
    top: 0; left: 10%;
    width: 80%;
    height: 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent);
    border-radius: 16px 16px 60% 60%;
    pointer-events: none;
  }

  /* Chrome bezel around the screen */
  .tv-bezel {
    background: linear-gradient(160deg, #dfe3e6, #9aa0a6 40%, #6c7176 60%, #babfc4);
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.4);
  }

  .tv-screen {
    background: #000;
    border-radius: 5px;
    overflow: hidden;
    border: 2px solid #0a0a0a;
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
  }

  .tv-screen iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* Bottom control panel: knobs on one side, speaker grille + brand plate on the other */
  .tv-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 16px 6px 20px;
  }

  .tv-knobs {
    display: flex;
    gap: 16px;
  }

  .tv-knob {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #f3d9a4, #c99a4e 55%, #8a5f28 100%);
    box-shadow:
      0 2px 5px rgba(0,0,0,0.6),
      inset 0 0 0 2px rgba(0,0,0,0.25);
    position: relative;
  }

  .tv-knob::after {
    content: "";
    position: absolute;
    top: 4px;
    left: 50%;
    width: 2px;
    height: 9px;
    background: #3a2712;
    transform: translateX(-50%);
    border-radius: 1px;
  }

  .tv-knob.small {
    width: 20px;
    height: 20px;
  }

  .tv-speaker {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .tv-speaker span {
    width: 4px;
    height: 26px;
    background: repeating-linear-gradient(180deg, #1a1410, #1a1410 3px, #2c231a 3px, #2c231a 5px);
    border-radius: 2px;
    opacity: 0.9;
  }

  .tv-brand-plate {
    font-family: "Lexend", sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #f0d29b;
    background: linear-gradient(160deg, #3a2717, #241a10);
    border: 1px solid rgba(225,180,112,0.4);
    padding: 4px 10px;
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* VISITOR PILLS */

  .visitor-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .visitor-pill {
    background: rgba(105, 65, 25, 0.35);
    border: 1px solid rgba(225, 180, 112, 0.3);
    color: #ffc978;
    font-weight: 600;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
  }

  /* HALL OF FAME — glass card, on-theme instead of a literal chalkboard */

  .fame-entry {
    font-size: 14.5px;
    line-height: 1.65;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(225,180,112,0.15);
    color: #ecdfc8;
  }

  .fame-entry:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .fame-entry b { color: #ffc978; font-weight: 600; }

  /* MODAL */

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: rgba(23,17,13,0.95);
    border: 1px solid #dda14b;
    padding: 30px 26px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    border-radius: 6px;
  }

  .modal-box p {
    font-size: 17px;
    margin: 0 0 20px;
    color: #f2e5cf;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
  }

  .modal-buttons button {
    flex: 1;
    padding: 12px;
    border: 1px solid #dda14b;
    font-family: "Lexend", sans-serif;
    font-size: 14px;
    cursor: pointer;
    border-radius: 3px;
  }

  .btn-stay {
    background: #dda14b;
    color: #17110d;
  }

  .btn-go {
    background: transparent;
    color: #f2e5cf;
  }

</style>

</head>

<body>

<div class="nav">
  <div class="nav-left">
    <img src="favicon-512.png" alt="PIYO.BAR" class="logo">
    <div class="nav-title">PIYO.BAR</div>
  </div>
  <div class="nav-right">
    <a href="index.html">Scene bata</a>
    <a href="#" id="whatsappLink">Doston ko bhi bula!</a>
    <a class="leave-link" id="leaveTrigger">Chal nikalta hoon 🚪</a>
  </div>
</div>

<div class="top-title-row">
  <h1 class="page-title" id="cheersHeading">Cheers, Yaar!</h1>
  <p class="welcome-line">Tera peg ready hai.</p>
</div>

<div class="split-wrap">

  <!-- LEFT: RETRO TV -->
  <div>
    <div class="tv">
      <div class="tv-bezel">
        <div class="tv-screen">
          <iframe
            src="https://www.youtube.com/embed/videoseries?list=PLMPuaohVmr4A"
            title="PIYO.BAR Playlist"
            allow="autoplay; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <div class="tv-controls">
        <div class="tv-knobs">
          <div class="tv-knob"></div>
          <div class="tv-knob small"></div>
        </div>
        <div class="tv-brand-plate">PIYO·VISION</div>
        <div class="tv-speaker">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: VISITOR LIST + HALL OF FAME + FORM -->
  <div>

    <div class="glass-card">
      <h2>Bajuwale table pe kaun hai?</h2>
      <div class="visitor-list" id="visitorList">
        <span class="visitor-pill">Loading...</span>
      </div>
    </div>

    <div class="glass-card">
      <h2>🥂 Akhand Backchodi</h2>
      <div id="fameList">
        <div class="fame-entry">Loading...</div>
      </div>
    </div>

    <div class="glass-card">
      <h2>Backchodi rukni nahi chahiye!</h2>
      <form id="cheersForm">

        <!-- Fallback name field, only shown if we don't already know the visitor's name -->
        <input type="text" id="cheersName" placeholder="Tera naam?" style="display:none;">

        <div class="peg-options">
          <div class="option">
            <input type="radio" id="c-rum" name="cpeg" value="Rum" required>
            <label for="c-rum">🥃 Rum</label>
          </div>
          <div class="option">
            <input type="radio" id="c-whisky" name="cpeg" value="Whisky">
            <label for="c-whisky">🥃 Whisky</label>
          </div>
          <div class="option">
            <input type="radio" id="c-beer" name="cpeg" value="Beer">
            <label for="c-beer">🍺 Beer</label>
          </div>
          <div class="option">
            <input type="radio" id="c-wine" name="cpeg" value="Wine">
            <label for="c-wine">🍷 Wine</label>
          </div>
        </div>

        <textarea id="cheersMessage" placeholder="Tu bhi kar..."></textarea>

        <button type="submit" class="submit-btn">AB CHEERS KAR! 🥂</button>

      </form>
    </div>

  </div>

</div>

<!-- AMBIENCE BUTTON -->
<button id="piyoAmbienceBtn">🔇</button>
<audio id="piyoAmbienceAudio" loop preload="none">
  <source src="https://github.com/shalakaofficial/PIYO.BAR/raw/refs/heads/main/Ambience%20Noise%20Option%203.mp3" type="audio/mpeg">
</audio>

<!-- LEAVE MODAL -->
<div class="modal-overlay" id="leaveModal">
  <div class="modal-box" id="leaveModalContent">
    <p>Itani jaldi? Ek last peg pi le yaar!</p>
    <div class="modal-buttons">
      <button class="btn-stay" id="stayBtn">Ok, one last...</button>
      <button class="btn-go" id="goBtn">Naah bro, gotta go!</button>
    </div>
  </div>
</div>

<script>

  // WHATSAPP LINK (same as home page)
  var waMessage = "Chal, ek peg maarte hain. Aa ja @ PIYO.BAR pe! https://www.piyo.bar 🥃";
  document.getElementById('whatsappLink').href =
    "https://wa.me/?text=" + encodeURIComponent(waMessage);

  // JSONP helper — bypasses CORS since Apps Script doesn't send the
  // headers a normal cross-origin fetch() needs to read the response
  function loadJSONP(url, onData, onError) {
    var callbackName = 'piyoCb_' + Math.random().toString(36).slice(2);
    var script = document.createElement('script');
    var done = false;

    var timeout = setTimeout(function () {
      if (!done) {
        done = true;
        cleanup();
        onError();
      }
    }, 8000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function (data) {
      if (done) return;
      done = true;
      cleanup();
      onData(data);
    };

    script.onerror = function () {
      if (done) return;
      done = true;
      cleanup();
      onError();
    };

    var sep = url.indexOf('?') > -1 ? '&' : '?';
    script.src = url + sep + 'callback=' + callbackName;
    document.head.appendChild(script);
  }

  // RETRIEVE NAME FROM HOME PAGE (localStorage, same-origin)
  var savedName = localStorage.getItem('piyoName');
  var cheersNameInput = document.getElementById('cheersName');
  var cheersHeading = document.getElementById('cheersHeading');

  if (savedName) {
    cheersHeading.textContent = "Cheers, " + savedName + "!";
  } else {
    // No name on file (e.g. visited Cheers directly) — show the fallback field
    cheersNameInput.style.display = 'block';
    cheersNameInput.required = true;
  }

  // BACKEND URL (same Apps Script project as the home page form)
  var scriptURL = "https://script.google.com/macros/s/AKfycbx2p_ALGkRuen-UMSvC547Ij6eaTN5XPBO5mfJac2eH0nEUnZsSsiorvbum4qUurpwg/exec";

  // LOAD VISITOR LIST ("Bajuwale table pe kaun hai?")
  var visitorList = document.getElementById('visitorList');

  loadJSONP(scriptURL + '?action=visitors', function (data) {
    visitorList.innerHTML = '';
    if (data.visitors && data.visitors.length) {
      data.visitors.forEach(function (name) {
        var pill = document.createElement('span');
        pill.className = 'visitor-pill';
        pill.textContent = name;
        visitorList.appendChild(pill);
      });
    } else {
      visitorList.innerHTML = '<span class="visitor-pill">Abhi koi nahi aaya</span>';
    }
  }, function () {
    visitorList.innerHTML = '<span class="visitor-pill">Load nahi ho paaya</span>';
  });

  // LOAD HALL OF FAME ("Akhand Backchodi")
  var fameList = document.getElementById('fameList');

  function loadFame() {
    loadJSONP(scriptURL + '?action=cheers', function (data) {
      fameList.innerHTML = '';
      if (data.entries && data.entries.length) {
        data.entries.forEach(function (entry) {
          var div = document.createElement('div');
          div.className = 'fame-entry';
          var text = '<b>' + entry.name + '</b> raised a ' + entry.peg + ' wala glass';
          if (entry.message) {
            text += ': "' + entry.message + '"';
          } else {
            text += '!';
          }
          div.innerHTML = text;
          fameList.appendChild(div);
        });
      } else {
        fameList.innerHTML = '<div class="fame-entry">Koi cheers nahi aaya abhi tak — pehla tu ban!</div>';
      }
    }, function () {
      fameList.innerHTML = '<div class="fame-entry">Load nahi ho paaya</div>';
    });
  }

  loadFame();

  // AMBIENCE TOGGLE
  var ambBtn = document.getElementById('piyoAmbienceBtn');
  var ambAudio = document.getElementById('piyoAmbienceAudio');
  var ambPlaying = false;

  ambBtn.addEventListener('click', function () {
    if (!ambPlaying) {
      ambAudio.volume = 0.4;
      ambAudio.play().then(function () {
        ambBtn.textContent = '🔊';
        ambPlaying = true;
      }).catch(function () {
        ambBtn.textContent = '⚠️';
      });
    } else {
      ambAudio.pause();
      ambBtn.textContent = '🔇';
      ambPlaying = false;
    }
  });

  // LEAVE THE BAR MODAL
  var leaveTrigger = document.getElementById('leaveTrigger');
  var leaveModal = document.getElementById('leaveModal');
  var leaveModalContent = document.getElementById('leaveModalContent');
  var stayBtn = document.getElementById('stayBtn');
  var goBtn = document.getElementById('goBtn');

  leaveTrigger.addEventListener('click', function () {
    leaveModal.classList.add('active');
  });

  stayBtn.addEventListener('click', function () {
    leaveModal.classList.remove('active');
  });

  goBtn.addEventListener('click', function () {

    // Hide the normal page content, replace with a full-screen
    // goodbye message over the background image
    document.querySelector('.nav').style.display = 'none';
    document.querySelector('.top-title-row').style.display = 'none';
    document.querySelector('.split-wrap').style.display = 'none';
    document.getElementById('piyoAmbienceBtn').style.display = 'none';

    leaveModal.innerHTML =
      '<div style="text-align:center;">' +
        '<p style="font-size:26px; color:#ffe0a6; margin:0;">Ok then,</p>' +
        '<p style="font-size:26px; color:#ffe0a6; margin:8px 0 0;">tomorrow — same place, same time! 🍻</p>' +
      '</div>';

    leaveModal.style.background = 'transparent';

  });

  // CHEERS FORM — real submission
  var cheersForm = document.getElementById('cheersForm');
  var cheersSubmitBtn = cheersForm.querySelector('.submit-btn');

  cheersForm.addEventListener('submit', function (e) {
    e.preventDefault();

    var nameToUse = savedName || cheersNameInput.value;
    var pegVal = cheersForm.querySelector('input[name="cpeg"]:checked');
    pegVal = pegVal ? pegVal.value : '';
    var messageVal = document.getElementById('cheersMessage').value;

    cheersSubmitBtn.disabled = true;
    cheersSubmitBtn.textContent = "Ek sec...";

    var formData = new FormData();
    formData.append('type', 'cheers');
    formData.append('name', nameToUse);
    formData.append('peg', pegVal);
    formData.append('message', messageVal);

    fetch(scriptURL, {
      method: 'POST',
      body: formData,
      mode: 'no-cors',
      keepalive: true
    }).catch(function () {}).finally(function () {

      // Optimistically add this entry to the top of the Hall of Fame
      var div = document.createElement('div');
      div.className = 'fame-entry';
      var text = '<b>' + nameToUse + '</b> raised a ' + pegVal + ' wala glass';
      text += messageVal ? ': "' + messageVal + '"' : '!';
      div.innerHTML = text;

      if (fameList.firstChild && fameList.firstChild.textContent.indexOf('Koi cheers nahi') !== -1) {
        fameList.innerHTML = '';
      }
      fameList.insertBefore(div, fameList.firstChild);

      cheersForm.reset();
      cheersSubmitBtn.disabled = false;
      cheersSubmitBtn.textContent = "AB CHEERS KAR! 🥂";
    });
  });

</script>

</body>
</html>
